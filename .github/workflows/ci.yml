name: CI

on:
  pull_request:
    branches: [preprod, main]
  push:
    branches: [preprod, main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # main (prod) ne reçoit que preprod : la prod reste fidèle à ce qui a tourné en preprod.
      - name: PR vers main depuis preprod uniquement
        if: github.base_ref == 'main' && github.head_ref != 'preprod'
        run: echo "::error::Les PR vers main doivent venir de preprod" && exit 1
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Outils d’extraction documentaire
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils unzip
      - run: npm run check
      - run: npm test
      - run: npm run build
